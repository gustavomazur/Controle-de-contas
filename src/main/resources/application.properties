spring.application.name=Controle-de-horas

# Conexão PostgreSQL LOCAL (variáveis de ambiente com fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controle_horas}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:local_pass_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:ZmVzdGl2YWxjYW1waW5oZXRyb3N0YXJzZWNyZXRhamF3c2VjcmV0a2V5MTIzNA==}
jwt.expiration-ms=3600000